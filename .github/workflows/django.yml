name: Django CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'

  push:
    branches: ["main", "feature/**"]
    paths:
      - 'app/**'

  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement à déployer"
        required: true
        type: choice
        options: [staging, prod]
        
      image_tag:
        description: "SHA de l'image Docker à promouvoir"
        required: true
        type: string

permissions:
  id-token: write # OIDC pour permettre github de se connecter  sur aws
  contents: read

env:
  AWS_REGION: "eu-west-3"

jobs:

  test:
    name: Tests Django
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'

    env:
      SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DEBUG: "True"
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd app
          pip install -r requirements.txt

      - name: Collect static files
        run: |
          cd app
          python manage.py collectstatic --noinput

      - name: Run tests
        run: |
          cd app
          python manage.py test

  build-and-push:
    name: Build + Push ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ecr
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build + Push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: "ecr-bassirou"
        run: |
          cd app
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "Image : $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  deploy-dev:
    name: "Deploy → dev"
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: dev

    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform apply avec le nouveau tag
        run: |
          cd infrastructure/environments/dev
          terraform init -input=false
          terraform apply -auto-approve \
            -var="image_tag=${{ github.sha }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="secret_key=${{ secrets.DJANGO_SECRET_KEY }}"
          echo "Déploiement de la nouvelle version sur ECS - dev"

      - name: Run DB migration
        run: |
          aws ecs run-task \
            --cluster cluster-bassirou-dev \
            --task-definition django-bassirou-dev \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.SUBNET_IDS_DEV }}],securityGroups=[${{ secrets.ECS_SG_DEV }}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"django","command":["python","manage.py","migrate"]}]}'
          echo "Migration Django lancée sur l'environnement dev"

  deploy-staging:
    name: "Deploy → staging"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'staging'

    environment:
      name: staging

    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform apply avec l'image à promouvoir
        run: |
          cd infrastructure/environments/staging
          terraform init -input=false
          terraform apply -auto-approve \
            -var="image_tag=${{ inputs.image_tag }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="secret_key=${{ secrets.DJANGO_SECRET_KEY }}"
          echo "🚀 Déploiement de la nouvelle version sur ECS - staging"

      - name: Run DB migration
        run: |
          aws ecs run-task \
            --cluster cluster-bassirou-staging \
            --task-definition django-bassirou-staging \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.SUBNET_IDS_STAGING }}],securityGroups=[${{ secrets.ECS_SG_STAGING }}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"django","command":["python","manage.py","migrate"]}]}'
          echo "Migration Django lancée sur l'environnement staging"

  deploy-prod:
    name: "Deploy → prod"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'prod'

    environment:
      name: prod

    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform apply avec l'image à promouvoir
        run: |
          cd infrastructure/environments/prod
          terraform init -input=false
          terraform apply -auto-approve \
            -var="image_tag=${{ inputs.image_tag }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="secret_key=${{ secrets.DJANGO_SECRET_KEY }}"
          echo "Déploiement de la nouvelle version sur ECS - prod"

      - name: Run DB migration
        run: |
          aws ecs run-task \
            --cluster cluster-bassirou-prod \
            --task-definition django-bassirou-prod \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.SUBNET_IDS_PROD }}],securityGroups=[${{ secrets.ECS_SG_PROD }}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"django","command":["python","manage.py","migrate"]}]}'
          echo "Migration Django lancée sur l'environnement prod"
