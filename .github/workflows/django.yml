name: Django CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'

  push:
    branches: ["main", "feature/**"]
    paths:
      - 'app/**'

  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [dev, staging, prod]

permissions:
  id-token: write   # nécessaire pour OIDC (pas de clé AWS stockée)
  contents: read

env:
  AWS_REGION: "eu-west-3"

jobs:

  test:
    name: Tests Django
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd app
          pip install -r requirements.txt

      - name: Collect static files
        run: python manage.py collectstatic --noinput
        
      - name: Run tests
        run: |
          cd app
          python manage.py test
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: "True"
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432

  # build + push — pas sur PR
  build-and-push:
    name: Build + Push ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login sur ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag SHA
        id: meta
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build + Push 
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          ECR_REPOSITORY: "ecr-bassirou-dev"
        run: |
          cd app
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .       
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
    
          echo "Image : $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"


  # DEPLOY DEV - manuel pr l'instant
  deploy-dev:
    name: "Deploy → dev"
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.environment == 'dev'

    environment:
      name: dev

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run DB migration
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster cluster-bassirou-dev \
            --task-definition django-bassirou-dev \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.SUBNET_IDS_DEV }}],securityGroups=[${{ secrets.ECS_SG_DEV }}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"django","command":["python","manage.py","migrate"]}]}' \
            --query 'tasks[0].taskArn' --output text)

          echo "Migration task lancée : $TASK_ARN"

      - name: Deploy ECS dev
        run: |
          aws ecs update-service \
            --cluster cluster-bassirou-dev \
            --service service-django-bassirou-dev \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          echo "Deploy dev lancé !"

 
  # DEPLOY STAGING - manuel
  deploy-staging:
    name: "Deploy staging"
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'staging'

    environment:
      name: staging
   
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Run DB migration
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster cluster-bassirou-staging \
            --task-definition django-bassirou-staging \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.SUBNET_IDS_STAGING }}],securityGroups=[${{ secrets.ECS_SG_STAGING }}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"django","command":["python","manage.py","migrate"]}]}' \
            --query 'tasks[0].taskArn' --output text)

          echo "Migration task lancée : $TASK_ARN"

      - name: Deploy ECS staging
        run: |
          aws ecs update-service \
            --cluster cluster-bassirou-staging \
            --service service-django-bassirou-staging \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          echo "✅ Deploy staging lancé !"

 
  # DEPLOY PROD - approbation manuelle (Required reviewers sur l'environment)
  deploy-prod:
    name: "Deploy prod"
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'prod'

    environment:
      name: prod

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run DB migration
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster cluster-bassirou-prod \
            --task-definition django-bassirou-prod \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.SUBNET_IDS_PROD }}],securityGroups=[${{ secrets.ECS_SG_PROD }}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"django","command":["python","manage.py","migrate"]}]}' \
            --query 'tasks[0].taskArn' --output text)

          echo "Migration task lancée : $TASK_ARN"

      - name: Deploy ECS prod
        run: |
          aws ecs update-service \
            --cluster cluster-bassirou-prod \
            --service service-django-bassirou-prod \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          echo "✅ Deploy prod lancé !"

